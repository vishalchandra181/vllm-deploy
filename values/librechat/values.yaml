
# LibreChat Helm values
replicaCount: 1

image:
  registry: ghcr.io
  repository: danny-avila/librechat
  tag: latest
  pullPolicy: IfNotPresent

# Service configuration
service:
  type: NodePort
  port: 3080
  targetPort: 3080
  containerPort: 3080
  nodePort: 30080
  annotations: {}

# Ingress disabled; access through NodePort
ingress:
  enabled: false

# LibreChat configuration
configEnv:
  existingSecretName: librechat-credentials-env
  configYamlContent: |
    version: 1.3.13
    cache: true

    endpoints:
      custom:
        - name: "vLLM"
          apiKey: "vllm"
          baseURL: "http://vllm-router-service.vllm.svc.cluster.local/v1"
          models:
            default:
              - "meta-llama/Llama-2-7b-hf"
            fetch: false
          titleConvo: true
          titleModel: "meta-llama/Llama-2-7b-hf"
          summarize: false

# MongoDB
mongodb:
  enabled: true

# Meilisearch
meilisearch:
  enabled: true

# Redis
redis:
  enabled: false

# Resources
resources: {}
