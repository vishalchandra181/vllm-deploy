
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vllm
  namespace: argocd
spec:
  project: default

  sources:
    # Official upstream Helm chart
    - repoURL: https://vllm-project.github.io/production-stack
      chart: vllm
      targetRevision: "0.1.0"
      helm:
        releaseName: vllm
        valueFiles:
          - $values/values/values.yaml

    # Your Git repository containing only values
    - repoURL: https://github.com/YOUR_ORG/vllm-gitops.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: vllm

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
