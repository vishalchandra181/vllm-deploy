
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vllm
  namespace: argocd

spec:
  project: default

  sources:
    # Official vLLM Production Stack Helm chart
    - repoURL: https://vllm-project.github.io/production-stack
      chart: vllm-stack
      targetRevision: "0.1.13"
      helm:
        releaseName: vllm
        valueFiles:
          - $values/values/values.yaml

    # Git repository containing Helm values
    - repoURL: https://github.com/vishalchandra181/vllm-deploy.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: vllm

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
