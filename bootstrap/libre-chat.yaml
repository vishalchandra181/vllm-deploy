apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: librechat
  namespace: argocd

spec:
  project: default

  sources:
    # LibreChat Helm chart
    - repoURL: ghcr.io/librechat-ai/librechat-chart
      chart: librechat
      targetRevision: "3.0.0"
      helm:
        releaseName: librechat
        valueFiles:
          - $values/librechat/values.yaml

    # Git repository containing Helm values
    - repoURL: https://github.com/vishalchandra181/vllm-deploy.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: librechat

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true